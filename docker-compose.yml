# ASTRA - local / single-server stack.
# Production on a public server: also apply docker-compose.prod.yml (HTTPS via Caddy). See docs/DEPLOYMENT.md.

services:
  postgres:
    image: postgres:16-alpine
    container_name: astra_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-astradb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [astra_network]

  redis:
    image: redis:7-alpine
    container_name: astra_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [astra_network]

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: astra_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-astradb}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CATALOG_CACHE_DIR: /app/logs
    # Only reachable from this computer; the browser talks to the API through the frontend's /api proxy.
    ports: ["127.0.0.1:5001:5001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [astra_network]
    deploy:
      resources:
        limits: { memory: 1G, cpus: '2.0' }

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/api}
    container_name: astra_frontend
    restart: unless-stopped
    ports: ["${FRONTEND_PORT:-80}:80"]
    depends_on:
      backend: { condition: service_healthy }
    networks: [astra_network]

  # Nightly compressed database dumps to ./backups, keeping the last BACKUP_KEEP_DAYS days.
  backup:
    image: postgres:16-alpine
    container_name: astra_backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME:-astradb}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-02}
    volumes:
      - ./backups:/backups
      - ./infrastructure/backup/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [astra_network]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: astra_prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    networks: [astra_network]

  grafana:
    image: grafana/grafana:11.2.2
    container_name: astra_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-${GRAFANA_PASSWORD:-admin}}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]
    networks: [astra_network]

volumes:
  postgres_data:
  redis_data:
  backend_logs:
  prometheus_data:
  grafana_data:

networks:
  astra_network:
    driver: bridge
